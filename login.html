<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KIKIAME</title>
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="stylesheet" href="assets/css/blog.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
<main class="admin-page">
    <div class="admin-container">
        <div class="admin-header">
            <span class="section-tag">KIKIAME</span>
            <h1>Área Administrativa</h1>
            <p>Entre com a sua conta para continuar.</p>
        </div>

        <form id="form-login">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="username" placeholder="Seu email" value="geralkikiame01@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Palavra-passe</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Sua palavra-passe" required>
            </div>

            <button type="submit" class="btn-orcamentos">
                <i class="fa-solid fa-right-to-bracket"></i>
                Entrar
            </button>

            <p id="mensagem" role="status" aria-live="polite"></p>
            <button type="button" id="mostrar-recuperacao" class="back-news">Definir nova palavra-passe</button>
        </form>

        <form id="form-recuperacao" hidden>
            <div class="form-group">
                <label for="codigo-recuperacao">Código recebido por email</label>
                <input type="text" id="codigo-recuperacao" name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="Código de 6 dígitos" required>
            </div>

            <div class="form-group">
                <label for="nova-password">Nova palavra-passe</label>
                <input type="password" id="nova-password" name="novaPassword" autocomplete="new-password" minlength="8" placeholder="Mínimo de 8 caracteres" required>
            </div>

            <div class="form-group">
                <label for="confirmar-password">Confirmar palavra-passe</label>
                <input type="password" id="confirmar-password" name="confirmarPassword" autocomplete="new-password" minlength="8" placeholder="Repita a nova palavra-passe" required>
            </div>

            <button type="submit" class="btn-orcamentos">
                <i class="fa-solid fa-key"></i>
                Confirmar nova palavra-passe
            </button>
            <p id="mensagem-recuperacao" role="status" aria-live="polite"></p>
            <button type="button" id="voltar-login" class="back-news">Voltar ao login</button>
        </form>

        <a href="index.html" class="back-news">
            <i class="fa-solid fa-arrow-left"></i>
            Página anterior
        </a>
    </div>
</main>

<script type="module" src="assets/js/login.js"></script>
<script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
</body>
</html>
